# SonarQube project configuration for the OnlineBookStore companion source code.
sonar.projectKey=OnlineBookStore
sonar.projectName=OnlineBookStore
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Local SonarQube default. The scan script sets host.docker.internal:9000 for Docker Desktop.
sonar.host.url=http://localhost:9000
# Never put the personal access token in this file. The scan script prompts for it.
